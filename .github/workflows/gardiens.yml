name: Gardiens du site vitrine

# LOT CI-VITRINE-1 — `on: push` etait NU, donc declenche sur TOUTES les
# branches. Mesure sur les 30 dernieres runs : 11 runs `pull_request` et 11
# runs `push` jumelles, meme SHA, meme resultat. Un tiers des runs de ce depot
# etaient une copie exacte d'une autre. Le filtre de branche les supprime.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: "gardiens-${{ github.ref }}"
  # Sur une PR, annuler la run precedente est un gain : seul le dernier commit
  # de la branche compte. Sur main, JAMAIS — deux merges rapproches
  # annuleraient la run du premier et le commit intermediaire repartirait non
  # teste. Meme correctif que stella-app (LOT CI-2, PR #29).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bloquant:
    name: Gardiens bloquants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: check copy (tirets cadratins)
        run: npm run lint:copy

      - name: check brand (aucune occurrence Avistars)
        run: npm run check:brand

      - name: Construire le site
        run: npx astro build

      - name: build llms-full (contenu complet pour les IA)
        run: npm run build:llms-full

      - name: check animations (les revelations survivent a la minification)
        run: npm run check:animations

      - name: check links
        run: npm run check:links

      - name: check schema (JSON-LD)
        run: npm run check:schema

      - name: check stripe (Payment Links LIVE)
        run: npm run check:stripe

      - name: check alt
        run: npm run check:alt

      - name: check channels
        run: npm run check:channels

      - name: check analytics
        run: npm run check:analytics

      - name: check partner
        run: npm run check:partner

      - name: Installer chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: check cookies (banniere de consentement + CSP de production)
        run: npm run check:cookies

      - name: check devis (parcours de devis, sans JavaScript)
        run: npm run check:devis

      - name: check pour (plancher de mots et unicite des pages metier)
        run: npm run check:pour

      - name: check overflow (aucun scroll horizontal)
        run: npm run check:overflow

      - name: check contraste (WCAG 1.4.3 sur le HTML rendu)
        run: npm run check:contraste

      # INDEXNOW_SKIP est PERMANENT, et ce n'est pas une dette.
      # Bing filtre les soumissions par ORIGINE. Mesure du 03/09/2026, meme cle,
      # meme charge utile, meme demi-heure : HTTP 202 depuis le build Vercel,
      # HTTP 403 UserForbiddedToAccessSite depuis un runner GitHub Actions
      # (run 33773938) et depuis un poste de developpement.
      # Le volet de soumission ne peut donc pas vivre ici : il serait rouge en
      # permanence alors que la production, elle, soumet bien. Ce qui reste
      # verifie en CI : la coherence de la cle, nom contre contenu.
      # Le ping reel se lit dans les logs de build Vercel, qui font foi.
      - name: check indexnow (la cle est coherente et la soumission aboutit)
        run: npm run check:indexnow
        env:
          INDEXNOW_SKIP: "1"

  alerte:
    name: Alertes (non bloquant)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: npm audit (vulnerabilites high)
        continue-on-error: true
        run: npm audit --audit-level=high

      - name: Construire le site
        run: npx astro build

      - name: check cities (seuils de contenu des pages villes)
        continue-on-error: true
        run: npm run check:cities
